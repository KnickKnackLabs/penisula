name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # aqua installs hit the GitHub API; a token keeps CI off the anonymous rate limit.
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          # Pinned: the action's default once resolved to an unavailable mise release.
          version: 2026.8.10
          install: true
          cache: true

      - name: Install bash 4+ (macOS)
        # Tasks and bats need a newer bash than the runner's 3.2; brew's prefix leads PATH.
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Run tests
        run: mise run test
